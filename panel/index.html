<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smoke Wave · панель менеджера</title>
<meta name="theme-color" content="#0d5c4f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Shared tokens and components come from the customer store mockup; styles.css adds panel-only parts. -->
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem('sw-final-theme');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t));}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">К содержимому</a>
<div class="app">
  <nav class="rail" aria-label="Разделы">
    <a class="rail-logo" href="#/" aria-label="Smoke Wave, заказы"><span class="mark">SW</span></a>
    <div class="rail-tabs" data-tabs></div>
    <button class="icon-btn rail-theme" type="button" data-act="theme" aria-label="Сменить тему"></button>
    <button class="icon-btn" type="button" data-act="signout" aria-label="Выйти" data-ic="out"></button>
  </nav>

  <div class="center">
    <header class="top">
      <div class="top-brand">
        <a class="brand" href="#/"><span class="mark">SW</span><span class="brand-txt"><b>Smoke Wave</b><small data-level></small></span></a>
        <span class="top-acts">
          <button class="icon-btn" type="button" data-act="theme" aria-label="Сменить тему"></button>
          <button class="icon-btn" type="button" data-act="signout" aria-label="Выйти" data-ic="out"></button>
        </span>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<nav class="tabbar" aria-label="Разделы"><div class="tabbar-in" data-tabs></div></nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" data-act="dialog-close"></div>
  <section class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1">
    <div class="sheet-in" id="sheet-in"></div>
  </section>
</div>

<div class="snack-wrap" aria-live="polite" role="status" id="snack"></div>
<div class="demo" id="demo"></div>

<script src="../data.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
